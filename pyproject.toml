[project]
name = "fitinera-nb-examples"
version = "0.1.0"
description = "Jupyter notebook examples and visualization tools for the fitinera library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fitinera>=0.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
